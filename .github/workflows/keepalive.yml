name: Keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.TRANSITPULSE_URL }}
        run: |
          if [ -z "${URL}" ]; then
            echo "TRANSITPULSE_URL is unset. Set it under Settings > Secrets and variables > Actions > Variables. Skipping the ping."
            exit 0
          fi
          URL="${URL%/}"
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${URL}/api/health"
          echo
